# Superopen project configuration. This is the authoritative source for enabled vendors, review behavior, graph refresh, retention, and feature settings.
# Updated by project maintainers and Superopen configuration commands.
layout_version: 2
vendors:
    enabled:
        - claude-code
        - cursor
        - codex
        - gemini
        - opencode
        - pi
    shared_agents: false
graph:
    code: true
    semantic: false
    semantic_backend: auto
    refresh_policy: after_changed_session
evals:
    auto: true
    on_session_end: true
    backend: auto
    agent_cli: auto
    models:
        claude: claude-sonnet-5
        codex: gpt-5.6-luna
recommendations:
    auto: true
    require_approval: true
    auto_apply_tiers:
        - soft
mcp:
    servers:
        - name: context7
          command: npx
          args:
            - -y
            - '@upstash/context7-mcp@1.0.0'
        - name: github
          command: npx
          args:
            - -y
            - '@modelcontextprotocol/server-github@2025.4.8'
observability:
    vendors:
        - claude-code
        - cursor
        - codex
        - gemini
        - opencode
        - pi
    exporters:
        - type: local_jsonl
          path: .so/sessions
    viz:
        citymap: false
        replay: true
memory:
    provider: file_lessons
    backend: auto
    idle_harvest_hours: 6
guardrails: {}
inject: {}
cost:
    track: true
retention:
    days: 7
