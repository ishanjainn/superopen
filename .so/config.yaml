llm:
    provider: openai
    model: gpt-4.1-mini
    api_key_env: SUPEROPEN_LLM_API_KEY
graph:
    code: true
    semantic: false
    semantic_backend: auto
evals:
    auto: true
    on_session_end: true
    backend: auto
    agent_cli: auto
    models:
        claude: claude-sonnet-5
        codex: gpt-5.6-luna
recommendations:
    auto: true
    require_approval: true
    auto_apply_tiers:
        - soft
observability:
    vendors:
        - claude-code
        - cursor
        - codex
        - gemini
        - opencode
        - copilot-cli
        - pi
    listen: http://127.0.0.1:4318
    exporters:
        - type: local_jsonl
          path: .so/traces
    viz:
        citymap: true
        replay: true
memory:
    provider: file_lessons
    backend: auto
    idle_harvest_hours: 6
guardrails: {}
inject: {}
cost:
    track: true
retention:
    days: 7
