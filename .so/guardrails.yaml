# Superopen guardrails. These are shared project safety rules enforced at coding-agent hook boundaries.
# Authoritative project policy updated by project maintainers and approved Superopen upgrades.
rules:
    - id: no-secrets
      description: Never commit secrets, API keys, tokens, or credentials
      severity: block
      source: llm
    - id: no-env-commit
      description: Never commit .env files or paste credentials into source or logs
      severity: block
      source: llm
    - id: run-tests
      description: Run relevant tests (go test -race, web npm test) before finishing
      severity: warn
      source: llm
    - id: avoid-unrelated
      description: Avoid changing unrelated code; keep diffs focused
      severity: warn
      source: llm
    - id: block-lockfile-edits
      description: Do not hand-edit go.sum, package-lock.json, or other lockfiles — use the package manager
      severity: warn
      source: llm
    - id: no-generated-edits
      description: Do not edit generated artifacts (dist/, vendor/, *.generated.*)
      severity: warn
      source: llm
    - id: go-race-tests
      description: Run go test with -race for concurrency-sensitive changes
      severity: warn
      source: llm
    - id: graph-query-first
      description: Prefer so graph query over broad grep when exploring the codebase
      severity: warn
      source: llm
    - id: conventional-commits
      description: Use Conventional Commit PR titles (feat:, fix:, docs:, etc.)
      severity: warn
      source: llm
    - id: respect-formatting
      description: Run go vet, web lint/typecheck, and match existing formatting
      severity: warn
      source: llm
approval: interactive
denied_tools: []
denied_commands:
    - rm -rf /
    - rm -rf /*
    - mkfs*
    - dd if=/dev/zero*
    - ':(){ :|:& };:'
    - curl *| sh
    - curl *| bash
    - wget *| sh
    - wget *| bash
    - chmod -R 777 /
sensitive_paths:
    - '**/.so/sessions/**'
    - '**/.so/audit/**'
redact_output: true
