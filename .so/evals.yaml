# Superopen evaluation policy. This defines how completed coding sessions are scored and which reviewer backends may be used.
# Authoritative project policy updated by project maintainers and approved Superopen upgrades.
checks:
  - tests
  - lint
  - scope
  - go_build
  - race_patterns
  - harness_usage
  - pr_title_convention

agent_rules:
  - "Prefer so graph query and AGENTS.md before broad code search"
  - "Keep diffs focused; avoid unrelated refactors"
  - "Run go test -race ./... for Go changes and web npm test/lint/typecheck for UI"
  - "Use Conventional Commit PR titles"
  - "Do not commit secrets or hand-edit lockfiles"

judge_rubric: |
  Score sessions on task completion, scope discipline, and verification. Reward use of so graph query, guardrails awareness, and running appropriate tests. Penalize secret exposure, lockfile hand-edits, unrelated diffs, and claiming done without test evidence. Soft improvements (memory, vendor rules) are fine; guardrail/eval-policy changes should stay pending for approval.

sources:
  - /Users/ishanjain/work/superopen/AGENTS.md
  - /Users/ishanjain/work/superopen/CONTRIBUTING.md
