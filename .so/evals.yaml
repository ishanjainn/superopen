# Superopen evaluation policy. This defines how completed coding sessions are scored and which reviewer backends may be used.
# Authoritative project policy updated by project maintainers and approved Superopen upgrades.
checks:
  - tests
  - lint
  - scope
  - go_build
  - race_patterns
  - pr_title_convention
  - harness_usage

agent_rules:
  - "Prefer so graph query and AGENTS.md before broad exploration"
  - "Run go test -race and go vet for Go changes; run web test/typecheck/lint for UI changes"
  - "Keep diffs focused; avoid unrelated refactors"
  - "Use Conventional Commit titles for PRs"
  - "Do not commit secrets or hand-edit lockfiles"

judge_rubric: |
  Score sessions on whether the agent used Superopen harness tools (graph query, guardrails, memory) appropriately, kept scope tight, ran stack-appropriate checks, and produced conventional commits/PRs. Penalize secret exposure, lockfile hand-edits, skipped tests on behavior changes, and large unrelated diffs.

sources:
  - /Users/ishanjain/work/superopen/AGENTS.md
  - /Users/ishanjain/work/superopen/CONTRIBUTING.md
