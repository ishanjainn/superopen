# Superopen evaluation policy. This defines how completed coding sessions are scored and which reviewer backends may be used.
# Authoritative project policy updated by project maintainers and approved Superopen upgrades.
checks:
  - tests
  - go_build
  - go_vet
  - race_patterns
  - web_tests
  - typescript_typecheck
  - eslint
  - plugin_sync_drift
  - cross_platform_paths
  - schema_compatibility
  - secret_scan
  - pr_title_convention

agent_rules:
  - "Prefer so graph query and repository guidance before broad code search."
  - "Keep changes focused and avoid unrelated edits."
  - "Preserve the file-backed contract across CLI, web, plugins, templates, and documentation."
  - "Add tests for behavior changes and run stack-appropriate checks."
  - "Protect sensitive data in source, telemetry, logs, fixtures, and harness files."
  - "Account for Linux, macOS, and Windows behavior in path, process, hook, and installer changes."

judge_rubric: |
  Score whether the session solved the stated task with a focused, evidence-backed change; respected repository architecture and the shared .so data contract; added or updated tests and documentation where warranted; ran the relevant Go, web, plugin, and cross-platform checks; and avoided secrets, unrelated churn, and unsupported claims. Reward concise graph-guided exploration and transparent reporting of validation gaps.

