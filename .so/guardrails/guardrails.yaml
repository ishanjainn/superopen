# Generated by so init (LLM upgrade) - advisory rules + enforcement.
# Edit freely; so sync will not overwrite this file.
rules:
    - id: no-secrets
      description: Never commit credentials, API keys, tokens, or other secrets; use non-sensitive examples and configuration placeholders.
      severity: block
      source: llm
    - id: run-tests
      description: Run focused tests and validation appropriate to every behavior change, and report any checks not run.
      severity: warn
      source: llm
    - id: avoid-unrelated
      description: Keep changes focused; do not include unrelated formatting, refactors, or generated drift.
      severity: warn
      source: llm
    - id: go-validation
      description: For Go or CLI changes, run go test -race -count=1 ./... and go vet ./... when scope and environment permit.
      severity: warn
      source: llm
    - id: web-validation
      description: For web changes, run the web test, typecheck, and lint commands before handoff.
      severity: warn
      source: llm
    - id: plugin-sync
      description: After plugin changes, run scripts/sync-plugins.sh and include required marketplace synchronization.
      severity: warn
      source: llm
    - id: behavior-tests
      description: Add or update tests for behavior changes and user-facing documentation when relevant.
      severity: warn
      source: llm
    - id: conventional-pr-title
      description: Use a clear Conventional Commit-style pull-request title.
      severity: warn
      source: llm
    - id: non-sensitive-logs
      description: Use only non-sensitive logs in issues, tests, fixtures, and documentation.
      severity: warn
      source: llm
approval: interactive
denied_commands:
    - rm -rf /
    - rm -rf /*
    - mkfs*
    - dd if=/dev/zero*
    - ':(){ :|:& };:'
    - curl *| sh
    - curl *| bash
    - wget *| sh
    - wget *| bash
    - chmod -R 777 /
sensitive_paths:
    - '**/.so/audit/**'
redact_output: true
