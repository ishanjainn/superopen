# Generated by so init (LLM upgrade) - advisory rules + enforcement.
# Edit freely; so sync will not overwrite this file.
rules:
    - id: no-secrets
      description: Never commit secrets, API keys, tokens, or real .env values
      severity: block
      source: llm
    - id: no-credential-logs
      description: Never log credentials, tokens, or secrets
      severity: block
      source: llm
    - id: run-tests
      description: 'Run focused tests for touched packages before finishing (go test -race -count=1 ./path; web: npm test/typecheck/lint)'
      severity: warn
      source: llm
    - id: avoid-unrelated
      description: Keep diffs scoped to the requested task; avoid unrelated refactors
      severity: warn
      source: llm
    - id: pr-title-convention
      description: Prefer Conventional Commit PR titles (feat:, fix:, docs:)
      severity: warn
      source: llm
    - id: go-race-tests
      description: Run race-sensitive Go packages with go test -race
      severity: warn
      source: llm
    - id: goroutine-lifecycle
      description: Never start a goroutine without a clear shutdown or WaitGroup story
      severity: warn
      source: llm
    - id: go-sync-ownership
      description: Prefer channels for ownership transfer; mutexes for shared mutable state
      severity: warn
      source: llm
    - id: sanitize-html-svg
      description: Sanitize untrusted HTML/SVG before rendering; prefer safe React text bindings
      severity: warn
      source: llm
    - id: safe-urls
      description: Build URLs with URL/URLSearchParams, not string concatenation
      severity: warn
      source: llm
    - id: no-fake-paths
      description: Do not invent secrets or fake paths in examples
      severity: warn
      source: llm
    - id: focused-go-checks
      description: Prefer package-scoped go test/vet while iterating; broaden only before merge
      severity: warn
      source: llm
approval: interactive
denied_commands:
    - rm -rf /
    - rm -rf /*
    - mkfs*
    - dd if=/dev/zero*
    - ':(){ :|:& };:'
    - curl *| sh
    - curl *| bash
    - wget *| sh
    - wget *| bash
    - chmod -R 777 /
sensitive_paths:
    - '**/.so/audit/**'
redact_output: true
