# Generated by so init (LLM upgrade) - advisory rules + enforcement.
# Edit freely; so sync will not overwrite this file.
rules:
    - id: no-secrets
      description: Never commit or invent API keys, tokens, passwords, or other credentials in code, docs, fixtures, or .so/ files.
      severity: block
      source: llm
    - id: no-public-security-issues
      description: Do not report security vulnerabilities in public issues; follow SECURITY.md.
      severity: block
      source: llm
    - id: run-tests
      description: 'Run focused checks for touched areas before finishing: Go race/vet for CLI; web test/typecheck/lint for UI.'
      severity: warn
      source: llm
    - id: avoid-unrelated
      description: Keep changes scoped to the request; avoid unrelated formatting, refactors, or drive-by edits.
      severity: warn
      source: llm
    - id: pr-title-convention
      description: Use Conventional Commit PR titles (feat:, fix:, fix(web):, etc.).
      severity: warn
      source: llm
    - id: go-race-vet
      description: For Go changes, prefer go test -race -count=1 and go vet on affected packages.
      severity: warn
      source: llm
    - id: npm-ignore-scripts
      description: When installing npm packages in web/, use --ignore-scripts unless the user explicitly allows scripts.
      severity: warn
      source: llm
    - id: plugin-sync-drift
      description: After plugin/template marketplace changes, run scripts/sync-plugins.sh and commit resulting drift.
      severity: warn
      source: llm
    - id: prefer-graph-query
      description: For codebase structure questions when .so/graph exists, prefer so graph query before broad exploration.
      severity: warn
      source: llm
    - id: single-guardrails-file
      description: Keep guardrails in the single file .so/guardrails/guardrails.yaml; do not invent parallel guardrail stores.
      severity: warn
      source: llm
approval: interactive
denied_commands:
    - rm -rf /
    - rm -rf /*
    - mkfs*
    - dd if=/dev/zero*
    - ':(){ :|:& };:'
    - curl *| sh
    - curl *| bash
    - wget *| sh
    - wget *| bash
    - chmod -R 777 /
sensitive_paths:
    - '**/.so/audit/**'
redact_output: true
