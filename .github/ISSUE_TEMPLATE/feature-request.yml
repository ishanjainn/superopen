name: "Feature Request"
description: Submit a proposal for a new feature
title: "Feature: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Superopen?
      options:
        - CLI (`so`)
        - Web UI (`so dev`)
        - Coding-agent hooks / plugins
        - Install / docs
        - Other
    validations:
      required: true

  - type: textarea
    id: feature-description
    attributes:
      label: What feature would you like to see?
      description: A clear description of the feature you want.
      placeholder: "Add support for..."
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why do you need this?
      description: Explain your use case and how this would help.
      placeholder: "I need this because..."
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context, screenshots, or examples.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
