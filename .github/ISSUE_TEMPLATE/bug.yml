name: "Bug Report"
description: Submit a bug report to help us improve
title: "Bug: "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Superopen?
      options:
        - CLI (`so`)
        - Web UI (`so dev`)
        - Coding-agent hooks / plugins
        - Install / docs
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "The sessions list crashes when..."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Run `so init`
        2. Run `so dev`
        3. Open Settings → …
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: "It should..."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide relevant version information.
      placeholder: |
        - so version: (`so --version` / `so version`)
        - OS: macOS 15 / Ubuntu 24.04 / Windows
        - Agent: Cursor / Claude Code / Codex / …
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, logs, or any other relevant information (no secrets).
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md)
          required: true
