name: CI / Web UI

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to validate
        required: false
        default: ""
        type: string
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "scripts/pack-web.sh"
      - ".github/workflows/ci-web.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "web/**"
      - "scripts/pack-web.sh"
      - ".github/workflows/ci-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Build should not require a live .so/ workspace
          SUPEROPEN_ROOT: ${{ github.workspace }}
      - name: Pack standalone UI
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p dist
          sh scripts/pack-web.sh --from web --tar dist/so-web.tar.gz
          # Consume tar fully. `tar | grep -q` closes the pipe early; GNU tar
          # then exits 2 ("stdout: write error") under pipefail.
          list=$(tar -tzf dist/so-web.tar.gz)
          case "$list" in
            *server.js*) ;;
            *) echo "::error::so-web.tar.gz is missing server.js"; exit 1 ;;
          esac
          case "$list" in
            *.next/BUILD_ID*) ;;
            *) echo "::error::so-web.tar.gz is missing .next/BUILD_ID"; exit 1 ;;
          esac
