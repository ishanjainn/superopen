name: CI / CLI AXI

on:
  pull_request:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'scripts/install.*'
      - 'scripts/uninstall.*'
      - 'scripts/check_cli_axi.py'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ci-cli-axi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axi-contract:
    name: Validate / AXI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test CLI output contracts
        run: go test -timeout 30m -count=1 ./cmd/so ./internal/cli ./internal/graph/format ./internal/agent/install ./internal/agent/uninstall
      - name: Build CLI
        run: go build -trimpath -o "$RUNNER_TEMP/so" ./cmd/so
      - name: Audit every user-facing command
        run: python3 scripts/check_cli_axi.py "$RUNNER_TEMP/so"
