name: CI / CLI

# Go tests + cross-compile smoke + plugin-tree drift check.
# PRs get the same signal as release.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to validate
        required: false
        default: ""
        type: string
  push:
    branches: ["main"]
    paths:
      - "cmd/**"
      - "internal/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - "scripts/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/ci-cli.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "cmd/**"
      - "internal/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - "scripts/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/ci-cli.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test / Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
          check-latest: true
      - name: go mod download
        run: go mod download
      - name: go build
        run: go build -trimpath ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        # -race for sessionstate / OTLP / projects registry concurrency.
        # -count=1 disables the test cache.
        run: go test -race -count=1 ./...

  cross-compile:
    name: Build / ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: linux, arch: amd64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
          check-latest: true
      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -trimpath -o /dev/null ./cmd/so

  plugin-sync:
    name: Validate / Plugin sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Sync into a temp dir and diff
        run: |
          set -euo pipefail
          BEFORE=$(mktemp -d)
          cp -R internal/coding/install/marketplace/. "$BEFORE/"
          bash scripts/sync-plugins.sh
          if ! diff -ru "$BEFORE" internal/coding/install/marketplace; then
            echo
            echo "::error::plugins/ or .claude-plugin/ has drifted from internal/coding/install/marketplace/."
            echo "Run \`bash scripts/sync-plugins.sh\` locally and commit the result."
            exit 1
          fi
          echo "embedded marketplace tree is in sync"
