name: Release / CLI

on:
  push:
    tags:
      - "cli-*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (cli-X.Y.Z)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, ext: "" }
          - { os: linux, arch: arm64, ext: "" }
          - { os: darwin, arch: amd64, ext: "" }
          - { os: darwin, arch: arm64, ext: "" }
          - { os: windows, arch: amd64, ext: ".exe" }
          - { os: windows, arch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
          check-latest: true
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="$(echo '${{ github.event.inputs.tag }}' | sed 's/^cli-//')"
          else
            VERSION="${GITHUB_REF#refs/tags/cli-}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9._-]+)?$'; then
            echo "::error::Could not resolve a semver release version (got '${VERSION}'). Pass a 'tag' input like 'cli-1.2.0' on workflow_dispatch, or push a 'cli-X.Y.Z' tag."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          VERSION="${{ steps.ver.outputs.VERSION }}"
          COMMIT="$(git rev-parse --short HEAD)"
          PKG="github.com/superopen/so/internal/version"
          go build -trimpath -ldflags "-s -w -X ${PKG}.Version=$VERSION -X ${PKG}.Commit=$COMMIT" \
            -o dist/so-${GOOS}-${GOARCH}${{ matrix.ext }} ./cmd/so
      - name: Package
        run: |
          NAME="so-${{ matrix.os }}-${{ matrix.arch }}"
          BIN="dist/${NAME}${{ matrix.ext }}"
          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip "${NAME}.zip" "$(basename "$BIN")"
            sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"
          else
            tar -czf "${NAME}.tar.gz" "$(basename "$BIN")"
            sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: so-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="$(echo '${{ github.event.inputs.tag }}' | sed 's/^cli-//')"
          else
            VERSION="${GITHUB_REF#refs/tags/cli-}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9._-]+)?$'; then
            echo "::error::Could not resolve a semver release version (got '${VERSION}')."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v8
        with: { path: artifacts }
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: cli-${{ steps.ver.outputs.VERSION }}
          name: cli-${{ steps.ver.outputs.VERSION }}
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="$(echo '${{ github.event.inputs.tag }}' | sed 's/^cli-//')"
          else
            VERSION="${GITHUB_REF#refs/tags/cli-}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9._-]+)?$'; then
            echo "::error::Could not resolve a semver release version (got '${VERSION}')."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
      - name: Update tap formula
        uses: dawidd6/action-homebrew-bump-formula@a0e064e08103c01870c6d1b05168d1b726aab119 # v8
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          tap: superopen/homebrew-so
          formula: so
          tag: cli-${{ steps.ver.outputs.VERSION }}
        continue-on-error: true
