cli:
- changed-files:
  - any-glob-to-any-file:
    - 'cmd/**'
    - 'internal/**'
    - 'go.mod'
    - 'go.sum'
    - 'Makefile'
    - 'VERSION'

sdk:
- changed-files:
  - any-glob-to-any-file: 'sdk/**'

web:
- changed-files:
  - any-glob-to-any-file: 'web/**'

plugins:
- changed-files:
  - any-glob-to-any-file:
    - 'plugins/**'
    - '.claude-plugin/**'

templates:
- changed-files:
  - any-glob-to-any-file: 'templates/**'

ci:
- changed-files:
  - any-glob-to-any-file:
    - '.github/**'
    - 'scripts/**'

Documentation:
- changed-files:
  - any-glob-to-any-file:
    - 'docs/**'
    - 'README.md'
    - 'CONTRIBUTING.md'
    - 'CODE_OF_CONDUCT.md'
    - 'SECURITY.md'
